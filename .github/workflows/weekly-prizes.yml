name: Weekly prizes
# Reads fnchesttracker.com and updates treasure_words.txt (Lobby Loop downloads it by itself).
on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours; it only commits when something changed
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_prizes.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- treasure_words.txt; then echo "No change"; exit 0; fi
          git config user.name "lobby-loop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add treasure_words.txt
          git commit -m "Weekly prizes: update from fnchesttracker.com"
          git push
